{% extends "base.html" %}
{% block title %}{{ name }}{% endblock %}
{% block content %}
<h1>{{ key }} / {{ name }}</h1>
<p><a href="/runs/{{ run.id }}/transcripts/{{ key }}">Back to transcripts</a></p>
{% if truncated %}<p class="hint">Showing the last 500 KB only.</p>{% endif %}
<pre class="block">{{ text }}</pre>
{% endblock %}
