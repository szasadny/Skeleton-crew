{% extends "base.html" %}
{% block title %}Limits{% endblock %}
{% block content %}
<h1>Limits</h1>
{{ m.general_errors(errors) }}
<form method="post" action="/limits">
  {{ m.csrf() }}
  <div class="grid">
    {% for spec in specs %}{{ m.number(spec, values, errors) }}{% endfor %}
  </div>
  <button type="submit">Save</button>
</form>
{% endblock %}
