{% import "_macros.html" as m with context %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false}'>
  <title>{% block title %}{% endblock %} - Skeleton Crew</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body hx-headers='{{ {"X-CSRF-Token": csrf_token} | tojson }}'>
  <header class="topbar">
    <span class="brand">Skeleton Crew</span>
    {% if authenticated %}
    <nav class="nav">
      {% for href, label, prefix in nav %}
      <a href="{{ href }}"{% if (path == "/" if prefix == "/" else path.startswith(prefix)) %} class="current"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <form method="post" action="/logout" class="logout">{{ m.csrf() }}<button type="submit" class="secondary">Log out</button></form>
    {% endif %}
  </header>
  <main>
    {% if message %}<p class="notice">{{ message }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
