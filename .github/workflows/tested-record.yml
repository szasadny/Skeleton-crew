name: Tested record

on:
  workflow_call:
    inputs:
      prefix:
        type: string
        required: true

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/ci-tested.sh tree
          echo "$GITHUB_SHA" >tested
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.prefix }}-tested-${{ steps.tree.outputs.sha }}
          path: tested
          retention-days: 30
