name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/tested-gate.yml
    with:
      prefix: ci
      workflow: .github/workflows/ci.yml

  check:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync lint-imports
      - run: uv run --no-sync pytest -q

  security:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv audit --locked --preview-features audit-command

  static:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes jscpd@4.3.0 --config .jscpd/src.json
      - run: npx --yes jscpd@4.3.0 --config .jscpd/tests.json

  record:
    needs: [check, security, static]
    if: ${{ github.event_name == 'pull_request' && !cancelled() && needs.check.result == 'success' && needs.security.result == 'success' && needs.static.result == 'success' }}
    uses: ./.github/workflows/tested-record.yml
    with:
      prefix: ci
