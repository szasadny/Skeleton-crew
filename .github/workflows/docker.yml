name: Docker

on:
  push:
    branches: [main]
    paths: &paths
      - src/skeleton_crew/runtime/**
      - src/skeleton_crew/domain/**
      - tests/runtime/**
      - tests/fakes/fake_runtime.py
      - scripts/install.sh
      - uv.lock
      - .github/workflows/docker.yml
      - .github/workflows/tested-gate.yml
      - .github/workflows/tested-record.yml
      - .github/scripts/ci-tested.sh
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  gate:
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/tested-gate.yml
    with:
      prefix: docker
      workflow: .github/workflows/docker.yml

  docker:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - name: Install Sysbox
        run: |
          deb=$(scripts/install.sh fetch-sysbox "$RUNNER_TEMP")
          sudo apt-get update
          sudo apt-get install -y fuse3 jq "$deb"
          docker info --format '{{json .Runtimes}}' | grep -q '"sysbox-runc"'
      - run: docker build -t skeleton-crew-agent:latest -f src/skeleton_crew/runtime/images/agent/Dockerfile src/skeleton_crew/runtime/images
      - run: docker build -t skeleton-crew-runner:latest -f src/skeleton_crew/runtime/images/runner/Dockerfile src/skeleton_crew/runtime/images
      - run: uv run --no-sync pytest -m docker -q

  record:
    needs: docker
    if: ${{ github.event_name == 'pull_request' && !cancelled() && needs.docker.result == 'success' }}
    uses: ./.github/workflows/tested-record.yml
    with:
      prefix: docker
