[project]
name = "skeleton-crew"
version = "0.1.0"
description = "Self-hosted orchestrator that lets coding-agent workers resolve labelled GitHub issues under hard guardrails."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "apscheduler>=3.11,<4",
    "argon2-cffi>=25.1.0",
    "docker>=7.2.0",
    "fastapi>=0.162.0",
    "githubkit[auth-app]>=0.17.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
skeleton-crew = "skeleton_crew.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "respx>=0.23.1",
    "ruff>=0.14",
    "types-docker>=7.2.0.20261006",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "ASYNC",
    "S",
    "PT",
    "TID",
    "N",
    "PLC0415",
    "ERA001",
    "TD",
    "FIX",
]
# Domain exceptions are named after what happened (Escalation, PolicyViolation).
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/fakes", "tests/support"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # githubkit 0.17 nudges towards httpx2; respx (our HTTP mock) only patches httpx.
    "ignore:Using `httpx` with GitHubKit is deprecated:DeprecationWarning",
]
addopts = "--strict-markers -m 'not docker'"
markers = [
    "docker: needs a real Docker daemon with the Sysbox runtime (VM or CI)",
]

[tool.importlinter]
root_package = "skeleton_crew"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers (ARCHITECTURE.md §3)"
type = "layers"
layers = [
    "skeleton_crew.cli",
    "skeleton_crew.web",
    "skeleton_crew.scheduler",
    "skeleton_crew.pipeline | skeleton_crew.services",
    "skeleton_crew.github | skeleton_crew.runtime | skeleton_crew.agents | skeleton_crew.classifiers | skeleton_crew.store",
    "skeleton_crew.models",
    "skeleton_crew.core",
    "skeleton_crew.domain",
]

[[tool.importlinter.contracts]]
name = "Private gateway modules are imported only by the gateway"
type = "forbidden"
source_modules = ["skeleton_crew.*", "skeleton_crew.github.*"]
forbidden_modules = [
    "skeleton_crew.github._auth",
    "skeleton_crew.github._git",
    "skeleton_crew.github._parse",
]
ignore_imports = [
    "skeleton_crew.github.gateway -> skeleton_crew.github._auth",
    "skeleton_crew.github.gateway -> skeleton_crew.github._git",
    "skeleton_crew.github.gateway -> skeleton_crew.github._parse",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "GitHub API client only in github/"
type = "forbidden"
source_modules = [
    "skeleton_crew.agents",
    "skeleton_crew.classifiers",
    "skeleton_crew.cli",
    "skeleton_crew.core",
    "skeleton_crew.domain",
    "skeleton_crew.models",
    "skeleton_crew.pipeline",
    "skeleton_crew.runtime",
    "skeleton_crew.scheduler",
    "skeleton_crew.services",
    "skeleton_crew.store",
    "skeleton_crew.web",
]
forbidden_modules = ["githubkit", "githubkit_schemas"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Docker client only in runtime/"
type = "forbidden"
source_modules = [
    "skeleton_crew.agents",
    "skeleton_crew.classifiers",
    "skeleton_crew.cli",
    "skeleton_crew.core",
    "skeleton_crew.domain",
    "skeleton_crew.github",
    "skeleton_crew.models",
    "skeleton_crew.pipeline",
    "skeleton_crew.scheduler",
    "skeleton_crew.services",
    "skeleton_crew.store",
    "skeleton_crew.web",
]
forbidden_modules = ["docker"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "HTTP client only in classifiers/"
type = "forbidden"
source_modules = [
    "skeleton_crew.agents",
    "skeleton_crew.cli",
    "skeleton_crew.core",
    "skeleton_crew.domain",
    "skeleton_crew.github",
    "skeleton_crew.models",
    "skeleton_crew.pipeline",
    "skeleton_crew.runtime",
    "skeleton_crew.scheduler",
    "skeleton_crew.services",
    "skeleton_crew.store",
    "skeleton_crew.web",
]
forbidden_modules = ["httpx"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "APScheduler only in scheduler/"
type = "forbidden"
source_modules = [
    "skeleton_crew.agents",
    "skeleton_crew.classifiers",
    "skeleton_crew.cli",
    "skeleton_crew.core",
    "skeleton_crew.domain",
    "skeleton_crew.github",
    "skeleton_crew.models",
    "skeleton_crew.pipeline",
    "skeleton_crew.runtime",
    "skeleton_crew.services",
    "skeleton_crew.store",
    "skeleton_crew.web",
]
forbidden_modules = ["apscheduler"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Web framework only in web/"
type = "forbidden"
source_modules = [
    "skeleton_crew.agents",
    "skeleton_crew.classifiers",
    "skeleton_crew.cli",
    "skeleton_crew.core",
    "skeleton_crew.domain",
    "skeleton_crew.github",
    "skeleton_crew.models",
    "skeleton_crew.pipeline",
    "skeleton_crew.runtime",
    "skeleton_crew.scheduler",
    "skeleton_crew.services",
    "skeleton_crew.store",
]
forbidden_modules = ["fastapi", "starlette"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "No database access outside store/, models/, core/ and wiring"
type = "forbidden"
source_modules = [
    "skeleton_crew.agents",
    "skeleton_crew.classifiers",
    "skeleton_crew.domain",
    "skeleton_crew.github",
    "skeleton_crew.runtime",
    "skeleton_crew.web.routes",
]
forbidden_modules = ["sqlalchemy"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Web reaches the pipeline only through web/ports.py (ARCHITECTURE.md §3)"
type = "forbidden"
source_modules = ["skeleton_crew.web"]
forbidden_modules = [
    "skeleton_crew.pipeline",
    "skeleton_crew.github",
    "skeleton_crew.runtime",
    "skeleton_crew.agents.base",
    "skeleton_crew.agents.session",
    "skeleton_crew.agents.prompting",
    "skeleton_crew.agents.backends",
    "skeleton_crew.classifiers.base",
    "skeleton_crew.classifiers.jev",
    "skeleton_crew.classifiers.openai_decisions",
]
allow_indirect_imports = true
